# Recording rules for watching a sweep live. The trace file the app writes is
# the record of a run; these views exist so a step can be eyeballed in
# Prometheus while it happens. Connectors run one at a time, so at any moment
# only one of a pair has fresh samples.
groups:
  - name: dapr-overhead
    interval: 15s
    rules:
      # Service latency per connector, labelled {backend, mode, op}.
      - record: bench:latency_p50
        expr: histogram_quantile(0.50, sum by (backend, mode, op, le) (rate(bench_op_duration_seconds_bucket[1m])))
      - record: bench:latency_p95
        expr: histogram_quantile(0.95, sum by (backend, mode, op, le) (rate(bench_op_duration_seconds_bucket[1m])))
      - record: bench:latency_p99
        expr: histogram_quantile(0.99, sum by (backend, mode, op, le) (rate(bench_op_duration_seconds_bucket[1m])))

      # Successful operations per second per connector.
      - record: bench:throughput
        expr: sum by (backend, mode, op) (rate(bench_ops_total{status="ok"}[1m]))
