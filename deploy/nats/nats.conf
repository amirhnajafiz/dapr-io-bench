# NATS server configuration for the benchmark.
# max_payload is raised from the 1 MB default to the server's 64 MB ceiling so
# the payload sweep can carry multi-megabyte messages; anything larger is
# rejected by the client before it leaves the app, which the trace records as
# an error. Dapr wraps each message in a CloudEvent (base64 for binary data),
# so its effective limit is about three quarters of this.
port: 4222
http: 8222
max_payload: 64MB
jetstream {
  store_dir: /data
}
